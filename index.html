<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6d4aff">
    <title>ManneTeilt</title>
    
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ManneTeilt">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-title">
                <h1>💸 ManneTeilt</h1>
                <span id="sessionCodeDisplay" class="session-code-badge hidden"></span>
            </div>
            <div class="header-actions">
                <!-- NEU: New Trip Button (immer sichtbar wenn Session aktiv) -->
                <button id="newTripBtn" class="btn-trip-btn hidden" title="Neue Reise">🔄</button>
                <button id="shareBtn" class="icon-btn hidden" aria-label="Link kopieren">🔗</button>
            </div>
        </header>

        <main class="main">
            <section id="sessionSection" class="section">
                <h2>Aktuelle Reise</h2>
                <div id="sessionInfo" class="card hidden">
                    <span id="sessionName">--</span>
                    <span id="syncStatus" class="status-badge">offline</span>
                </div>
                <button id="newSessionBtn" class="btn btn-primary">Neue Reise starten</button>
                <div id="joinSection" class="join-section">
                    <p class="join-label">oder Reise-Code eingeben:</p>
                    <form id="joinForm" class="form-inline">
                        <input type="text" id="sessionCodeInput" 
                               placeholder="ABC123" 
                               maxlength="6"
                               inputmode="text"
                               autocapitalize="characters"
                               required>
                        <button type="submit" class="btn btn-sm btn-primary">Beitreten</button>
                    </form>
                </div>
            </section>

            <section id="participantsSection" class="section hidden">
                <div class="section-header">
                    <h2>Teilnehmer</h2>
                    <span id="participantCount" class="badge hidden"></span>
                </div>
                <div id="participantsListExpanded">
                    <div id="participantsList" class="list"></div>
                    <form id="addParticipantForm" class="form-inline">
                        <input type="text" id="participantName" placeholder="Name" required>
                        <button type="submit" class="btn btn-sm">+</button>
                    </form>
                </div>
                <div id="participantsCompact" class="hidden">
                    <div id="participantsChips" class="chips-container"></div>
                    <button id="toggleParticipantsBtn" class="btn-text">Teilnehmer verwalten ▾</button>
                </div>
            </section>

            <section id="expensesSection" class="section hidden">
                <h2>Ausgaben</h2>
                <div id="expensesList" class="list"></div>
                <button id="addExpenseBtn" class="btn btn-full btn-primary">➕ Neue Ausgabe</button>
            </section>

            <section id="balanceSection" class="section hidden">
                <h2>Wer schuldet wem?</h2>
                <div id="balanceList" class="cards-grid"></div>
            </section>
        </main>

        <dialog id="expenseModal" class="modal">
            <form id="expenseForm" method="dialog">
                <h3>Neue Ausgabe</h3>
                <input type="hidden" id="expenseId">
                
                <label>Gezahlt von:</label>
                <select id="payerSelect" required></select>
                
                <label>Betrag (€):</label>
                <input type="number" id="expenseAmount" step="0.01" min="0.01" inputmode="decimal" required>
                
                <div class="split-header">
                    <label>Für wen?</label>
                    <button type="button" id="toggleAllSplit" class="btn-text">Alle abwählen</button>
                </div>
                <div id="splitParticipants" class="checkbox-group"></div>
                
                <label>Bemerkung:</label>
                <input type="text" id="expenseNote" placeholder="z.B. Tanken, Hotel">
                
                <div class="modal-actions">
                    <button type="button" id="deleteExpenseBtn" class="btn btn-danger">Löschen</button>
                    <button type="submit" class="btn btn-primary">Speichern</button>
                </div>
            </form>
        </dialog>

        <div id="toast" class="toast hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
